<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Small change</title>
<style>body{font-family:system-ui,sans-serif;max-width:700px;margin:40px auto;padding:0 16px} #clock{font-size:32px;font-weight:bold}</style></head>
<body>
<!-- Test page: only a small clock changes. Expect a yellow badge with a small percentage and only the clock highlighted. -->
<h1>A page with a small live element</h1>
<p>Only the clock below changes. Expect a yellow badge and only the clock area highlighted.</p>
<div id="clock"></div>
<script>setInterval(() => document.getElementById('clock').textContent = new Date().toLocaleTimeString(), 1000);</script>
</body>
</html>
